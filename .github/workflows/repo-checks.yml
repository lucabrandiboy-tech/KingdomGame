# Runs on GitHub's computers after every push. A red X next to a commit on
# github.com means one of these checks failed; click it to see which file.
# It can't open Unity, so it checks that files were committed correctly, that
# every script compiles (against Unity's reference assemblies) and runs the
# tests for the code that doesn't need Unity.
name: Repo checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false # the real art files aren't needed, only their LFS pointers

      - name: Every Unity asset has its .meta file
        run: python3 tools/check_meta.py

      - name: Art, audio and other big files are stored with Git LFS
        run: git lfs fsck --pointers

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Every game script compiles (new input system, like the game)
        run: dotnet build tools/compile-check/CompileCheck.csproj

      - name: Every game script compiles (old input path)
        run: dotnet build tools/compile-check/CompileCheck.csproj --no-incremental "-p:DefineConstants=UNITY_EDITOR%3BENABLE_LEGACY_INPUT_MANAGER"

      - name: The art preview tool compiles
        run: dotnet build -c Release tools/art-preview/ArtPreview.csproj

      - name: Destruction math unit tests
        run: dotnet run --project tools/tests/DestructionTests.csproj

      - name: Network tests (a real server and players over UDP on the runner)
        run: dotnet run --project tools/net-tests/NetTests.csproj

      - name: Endless world tests (nature map squares, saving changes, ground squares joining up)
        run: dotnet run --project tools/world-tests/WorldTests.csproj
